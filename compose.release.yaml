# Code is baked into the verified image. Persistent data volumes are retained.
services:
  inference:
    build: !reset null
  airflow:
    volumes: !override
      - airflow-data:/opt/airflow
  mlflow:
    volumes: !reset []
  inference-blue:
    build: !reset null
    volumes: !reset []
  inference-green:
    build: !reset null
    volumes: !reset []
  traffic:
    volumes: !reset []
  qdrant-init:
    volumes: !reset []
  redisinsight-init:
    volumes: !reset []
  s3-init:
    volumes: !override
      - mlflow-artifacts:/legacy-artifacts:ro
