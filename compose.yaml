name: ml-airflow-demo
x-app: &app
  image: ${DEMO_IMAGE:-ml-airflow-demo:local}
  volumes:
    - .:/opt/demo:ro
  environment: &env
    PYTHONPATH: /opt/demo
    DEMO_DATABASE_URL: postgresql://demo:demo_local@postgres:5432/demo
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_EXPERIMENT_NAME: churn-online-demo
  depends_on:
    postgres:
      condition: service_healthy

x-s3-env: &s3-env
  MLFLOW_S3_ENDPOINT_URL: http://s3:9000
  AWS_ACCESS_KEY_ID: demo_s3
  AWS_SECRET_ACCESS_KEY: demo_s3_password
  AWS_DEFAULT_REGION: us-east-1
  S3_BUCKET: mlflow-artifacts

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=15d']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: demo_grafana
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30

  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: demo_s3
      RUSTFS_SECRET_KEY: demo_s3_password
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes:
      - s3-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/health]
      interval: 5s
      timeout: 5s
      retries: 30

  s3-init:
    image: ${DEMO_IMAGE:-ml-airflow-demo:local}
    entrypoint: []
    command: [python, /opt/demo/scripts/init_s3.py]
    environment: *s3-env
    volumes:
      - .:/opt/demo:ro
      - mlflow-artifacts:/legacy-artifacts:ro
    depends_on:
      s3:
        condition: service_healthy

  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local
      POSTGRES_DB: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    <<: *app
    entrypoint: []
    command: [mlflow, server, --host, 0.0.0.0, --port, '5000', --workers, '1', --backend-store-uri, 'postgresql://demo:demo_local@postgres:5432/demo', --artifacts-destination, 's3://mlflow-artifacts', --serve-artifacts, --allowed-hosts, 'mlflow:5000,localhost:5000,127.0.0.1:5000']
    environment:
      <<: [*env, *s3-env]
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports: ['127.0.0.1:5000:5000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 30
    volumes:
      - .:/opt/demo:ro

  airflow:
    <<: *app
    build: .
    depends_on:
      mlflow:
        condition: service_healthy
    command: standalone
    environment:
      <<: *env
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/demo/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: '4'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '10'
      AIRFLOW__API__WORKERS: '1'
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - .:/opt/demo:ro
      - airflow-data:/opt/airflow

  inference:
    <<: *app
    entrypoint: []
    command: [uvicorn, service.app:app, --host, 0.0.0.0, --port, '8000']
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 20

  database-ui:
    image: adminer:5.4.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  s3-data:
  mlflow-artifacts:
  airflow-data:
